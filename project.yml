# EBookQL — Quick Look preview + thumbnail extensions for EPUB and MOBI (Kindle) books.
#
#   xcodegen generate      # writes EBookQL.xcodeproj from this file
#   ./install.sh           # build a Release app and copy it to /Applications
#
# Four targets: the host application that carries the extensions, a Quick Look
# preview extension, a Quick Look thumbnail extension, and the shared framework
# (EBookQLKit) that holds every format backend, the reader page and the reading
# position store. Edit this file, not the generated project.

name: EBookQL

options:
  bundleIdPrefix: com.rocaltair
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
    # Release builds must not carry the debugging entitlement ("get-task-allow"):
    # Quick Look badges such extensions as [DEBUG] in the preview window.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Sign to Run Locally: ad-hoc signature, no developer account needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

# Shared schemes, so `xcodebuild -scheme EBookQL` works on a fresh clone
# (xcodegen writes no schemes unless they are declared here).
schemes:
  EBookQL:
    build:
      targets:
        EBookQL: all
  EBookQLPreview:
    build:
      targets:
        EBookQLPreview: all
  EBookQLThumbnail:
    build:
      targets:
        EBookQLThumbnail: all
  EBookQLMarkdownPreview:
    build:
      targets:
        EBookQLMarkdownPreview: all
  EBookQLMarkdownThumbnail:
    build:
      targets:
        EBookQLMarkdownThumbnail: all
  EBookQLCHMPreview:
    build:
      targets:
        EBookQLCHMPreview: all
  EBookQLCHMThumbnail:
    build:
      targets:
        EBookQLCHMThumbnail: all

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:

  # Shared core: format backends, the reader page, the reading-position store.
  #
  # A *static* library on purpose. An embedded dynamic framework cannot be loaded
  # by an ad-hoc-signed app extension: Library Validation compares the two
  # signatures, finds no matching Team ID, and the extension dies in dyld before
  # it runs ("different Team IDs"). Static linking has no dylib and no such check,
  # which is also how both reference projects (MobiFile, epub-quicklook-extension)
  # share their parsing code.
  EBookQLKit:
    type: library.static
    platform: macOS
    sources:
      - path: EBookQLKit
        # Found through HEADER_SEARCH_PATHS instead (see below), not compiled. The
        # AGENTS.md files are documentation, never a payload (and several share the
        # name, so a flat copy would collide).
        excludes: ["Vendor/libmobi/module.modulemap", "**/AGENTS.md", "AGENTS.md"]
    settings:
      base:
        PRODUCT_NAME: EBookQLKit
        GCC_C_LANGUAGE_STANDARD: gnu99
        HEADER_SEARCH_PATHS:
          # The module map that exposes the vendored libmobi to Swift lives here.
          - "$(SRCROOT)/EBookQLKit/Vendor/libmobi"
          - "$(SDKROOT)/usr/include/libxml2"
    dependencies:
      - package: ZIPFoundation

  # Host application: exists to carry the two extensions and to declare the UTIs.
  EBookQL:
    type: application
    platform: macOS
    sources:
      - path: EBookQLApp
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_NAME: EBookQL
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.EBookQL
        INFOPLIST_FILE: EBookQLApp/Info.plist
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: EBookQLPreview
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ""
      - target: EBookQLThumbnail
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ""
      - target: EBookQLMarkdownPreview
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ""
      - target: EBookQLMarkdownThumbnail
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ""
      - target: EBookQLCHMPreview
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ""
      - target: EBookQLCHMThumbnail
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ""

  EBookQLPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: EBookQLPreview
        # ReaderAssets (the vendored Mermaid/KaTeX) is excluded here: it now ships
        # only in EBookQLMarkdownPreview, which forces it into the resources phase so
        # the reader finds it at the appex bundle root by bare filename.
        # DjVuAssets is added below as resources instead of compiled-in sources.
        excludes: ["Info.plist", "*.entitlements", "ReaderAssets", "DjVuAssets", "AGENTS.md"]
      # The DjVu page decoder: the vendored JavaScript rasteriser (ZP/BZZ, JB2, IW44,
      # MMR, the container and the compositor) plus the reader's own glue. It ships
      # only here - no other appex can be handed a .djvu - and lands flat at the appex
      # bundle root, where `ekbres://assets/<file>` finds a file by bare name and the
      # modules can still import each other by relative path.
      - path: EBookQLPreview/DjVuAssets
        buildPhase: resources
        excludes: ["AGENTS.md"]
    settings:
      base:
        PRODUCT_NAME: EBookQLPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.EBookQL.Preview
        INFOPLIST_FILE: EBookQLPreview/Info.plist
        CODE_SIGN_ENTITLEMENTS: EBookQLPreview/EBookQLPreview.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-framework"
          - "WebKit"
          - "-framework"
          - "JavaScriptCore"
          - "-framework"
          - "QuickLookUI"
          # The extension context class for com.apple.quicklook.preview lives in
          # QuickLookUI, and without it the extension dies in
          # +[EXConcreteExtensionContextVendor _extensionContextClass] as soon as
          # the host connects. `needed` keeps the framework even though nothing
          # in our code references one of its classes.
          - "-Wl,-needed_framework,QuickLookUI"
          # libmobi (vendored in EBookQLKit) needs both; a static library cannot
          # link, so the extension does it.
          - "-lxml2"
          - "-lz"
          # Reading positions (ReadingPositionStore).
          - "-lsqlite3"
        # EBookQLKit's module pulls in the MobiLib C module, so the appex has to be
        # able to find its module map too.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/EBookQLKit/Vendor/libmobi"
    dependencies:
      - target: EBookQLKit
      # A static library cannot link, so the appex links the package product too.
      - package: ZIPFoundation

  EBookQLThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: EBookQLThumbnail
        excludes: ["Info.plist", "*.entitlements", "AGENTS.md"]
    settings:
      base:
        PRODUCT_NAME: EBookQLThumbnail
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.EBookQL.Thumbnail
        INFOPLIST_FILE: EBookQLThumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: EBookQLThumbnail/EBookQLThumbnail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-framework"
          - "JavaScriptCore"
          - "-lxml2"
          - "-lz"
          - "-lsqlite3"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/EBookQLKit/Vendor/libmobi"
    dependencies:
      - target: EBookQLKit
      - package: ZIPFoundation

  # Markdown-only siblings of the two appexes above. Separating them lets the
  # user enable/disable Markdown Quick Look independently of EPUB/MOBI (Quick Look
  # falls back to the system text generator when these are off).
  EBookQLMarkdownPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: EBookQLPreview
        excludes: ["Info.plist", "*.entitlements", "ReaderAssets", "DjVuAssets", "AGENTS.md"]
      - path: EBookQLPreview/ReaderAssets
        buildPhase: resources
        # NOTICES.md is a payload (licence notices); its sibling AGENTS.md is not.
        excludes: ["AGENTS.md"]
        # Created by the asset task; tolerate it being absent so generation never
        # fails on a partially provisioned checkout.
        optional: true
    settings:
      base:
        PRODUCT_NAME: EBookQLMarkdownPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.EBookQL.MarkdownPreview
        INFOPLIST_FILE: EBookQLMarkdownPreview/Info.plist
        CODE_SIGN_ENTITLEMENTS: EBookQLMarkdownPreview/EBookQLMarkdownPreview.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-framework"
          - "WebKit"
          - "-framework"
          - "JavaScriptCore"
          - "-framework"
          - "QuickLookUI"
          - "-Wl,-needed_framework,QuickLookUI"
          - "-lxml2"
          - "-lz"
          - "-lsqlite3"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/EBookQLKit/Vendor/libmobi"
    dependencies:
      - target: EBookQLKit
      - package: ZIPFoundation

  EBookQLMarkdownThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: EBookQLThumbnail
        excludes: ["Info.plist", "*.entitlements", "AGENTS.md"]
    settings:
      base:
        PRODUCT_NAME: EBookQLMarkdownThumbnail
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.EBookQL.MarkdownThumbnail
        INFOPLIST_FILE: EBookQLMarkdownThumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: EBookQLMarkdownThumbnail/EBookQLMarkdownThumbnail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-framework"
          - "JavaScriptCore"
          - "-lxml2"
          - "-lz"
          - "-lsqlite3"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/EBookQLKit/Vendor/libmobi"
    dependencies:
      - target: EBookQLKit
      - package: ZIPFoundation

  # CHM-only sibling of EBookQLPreview.appex. .chm is off by default: the user turns it on in the
  # app's window, which is what flips these two appexes between pluginkit's ignore and use.
  EBookQLCHMPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: EBookQLPreview
        excludes: ["Info.plist", "*.entitlements", "ReaderAssets", "DjVuAssets", "AGENTS.md"]
    settings:
      base:
        PRODUCT_NAME: EBookQLCHMPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.EBookQL.CHMPreview
        INFOPLIST_FILE: EBookQLCHMPreview/Info.plist
        CODE_SIGN_ENTITLEMENTS: EBookQLCHMPreview/EBookQLCHMPreview.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-framework"
          - "WebKit"
          - "-framework"
          - "JavaScriptCore"
          - "-framework"
          - "QuickLookUI"
          - "-Wl,-needed_framework,QuickLookUI"
          - "-lxml2"
          - "-lz"
          - "-lsqlite3"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/EBookQLKit/Vendor/libmobi"
    dependencies:
      - target: EBookQLKit
      - package: ZIPFoundation

  # CHM-only sibling of EBookQLThumbnail.appex. .chm is off by default: the user turns it on in the
  # app's window, which is what flips these two appexes between pluginkit's ignore and use.
  EBookQLCHMThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: EBookQLThumbnail
        excludes: ["Info.plist", "*.entitlements", "AGENTS.md"]
    settings:
      base:
        PRODUCT_NAME: EBookQLCHMThumbnail
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.EBookQL.CHMThumbnail
        INFOPLIST_FILE: EBookQLCHMThumbnail/Info.plist
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/EBookQLKit/Vendor/libmobi"
        CODE_SIGN_ENTITLEMENTS: EBookQLCHMThumbnail/EBookQLCHMThumbnail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: EBookQLKit
      - package: ZIPFoundation
